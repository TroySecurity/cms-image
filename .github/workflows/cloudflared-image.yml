name: cloudflared-image

# Pull requests: test and build only (nothing is pushed).
# Tags `cloudflared-<cloudflared version>-probe<N>` (e.g. cloudflared-2026.10.4-probe1):
# test, build for linux/amd64 and linux/arm64, push to GHCR and print the digest.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - cmd/**
      - .github/workflows/cloudflared-image.yml
  push:
    tags:
      - "cloudflared-*-probe*"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/troysecurity/cms-edge-cloudflared

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME#cloudflared-}" >> "$GITHUB_OUTPUT"
          else
            echo "name=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on a tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Digest
        if: github.event_name == 'push'
        run: |
          echo "Pin this in the edge config:"
          echo "${IMAGE}@${{ steps.build.outputs.digest }}"
          echo "### Pin" >> "$GITHUB_STEP_SUMMARY"
          echo '`'"${IMAGE}@${{ steps.build.outputs.digest }}"'`' >> "$GITHUB_STEP_SUMMARY"
